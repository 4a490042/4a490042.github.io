<script type="text/javascript">
$(window).scroll(
        function() {
            var scrollTop = $(this).scrollTop();
            var scrollHeight = window.innerHeight
            var windowHeight = $(this).height();
            
             
            if (scrollTop + scrollHeight == windowHeight) {
                
                // 此处写滚动条到底部时候触发的事件
               $(".float-button").show()
            }else{
                $(".float-button").hide()
            }
        }
    );
$(document).ready(function() {

    $.ajax({
  url: "json/DM_Milk.json",
  type: "GET",
  dataType: "json",
  success: function(Jdata) {
     var tmp1 ="";
    
     for (var i = 0; i < Jdata.length; i++) {

            tmp1 +=(" <div class=\"card\" style=\"width: 20rem;\"><img src=\"DM_img/Milk/"+Jdata[i].name+".jpg\" class=\"card-img-top\"><div class=\"card-body\"><h3 class=\"card-title\">"+Jdata[i].title+"</h3> <p>促銷價:&ensp;"+Jdata[i].price+"</p></div></div>")
        }
    $('#Milk').html("<div class=\"BlockTitle\">好好喝奶</div><div class=\"slide-box\">"+tmp1+"</div>")
  },
  
  error: function() {
    alert("ERROR!!!");
  }
});
   })

 $(".float-button").on("click", function (event) {
    $("html, body").animate(
      {
        scrollTop: 0
      },
      500 // 回頂部時間為 500 毫秒
    );
  });

$("#Chose button").on("click", function (event) {
    var tmp = $(this).attr('txt');
    var all = $('#All').children().length;
   $('#All').children().fadeOut(300)
   if (tmp == "All") {

    $('#All').children().fadeIn(300);
   }else{
for (var i = 0; i < all; i++) {
         
       if (tmp == $($('#All').children()[i]).attr('id')) {
 

        $($('#All').children()[i]).fadeIn(300);
       }
    }

   }
    
    
  });
</script>
